    <rect x="695" y="474" width="84" height="22" rx="4"/><rect x="706" y="496" width="62" height="196"/>
    <rect x="214" y="712" width="596" height="38" rx="5"/>
    <rect x="174" y="768" width="676" height="40" rx="6"/>
