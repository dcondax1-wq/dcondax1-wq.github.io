<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- OLYMPUS Home Screen icon (2026-11-18): a gold Greek temple on deep navy. Full bleed, opaque (iOS rounds the corners).
       Simple flat shapes so it reads at 60 px: pediment, beam, four columns, two steps. Source of every PNG next to it: python tools/icon_temple.py. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16264a"/><stop offset=".6" stop-color="#0d1834"/><stop offset="1" stop-color="#081025"/></linearGradient>
    <radialGradient id="halo" cx="512" cy="470" r="470" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2b4377" stop-opacity=".75"/><stop offset="1" stop-color="#2b4377" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="230" x2="0" y2="800" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fbe7b0"/><stop offset=".45" stop-color="#e2b65c"/><stop offset="1" stop-color="#b0802f"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <g id="art" fill="url(#gold)">
