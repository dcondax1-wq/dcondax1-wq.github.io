</head>
<body>
<main id="app" data-state="loading">
  <header class="wk-top">
    <a class="wk-back" href="./" aria-label="Back to NQ">‹ NQ</a>
    <h1><span class="wk-orb" aria-hidden="true"></span>Week in Review</h1>
    <span class="wk-chip" id="src" data-level="warn" role="status" aria-live="polite">Loading…</span>
  </header>
  <nav class="wk-picker" id="picker" aria-label="Pick a week"></nav>
  <section class="wk-hero" id="hero" aria-label="The week at a glance"></section>

  <div id="accounts"></div>
  <div id="rejected"></div>
  <div id="twin"></div>
  <div id="waiting"></div>
  <div id="clock"></div>
  <div id="of"></div>
  <div id="blitz"></div>
  <div id="next"></div>
  <div id="gradeBox"></div>
  <p class="wk-foot">Read only: nothing on this page places, sizes or changes a trade. Built from the PC's public status feed, the bots' backtest twins and the audited trade days. Backtest $ are at the twin's size; "would have made" is hindsight.</p>
</main>
<script src="weekcore.js?v=1"></script>
