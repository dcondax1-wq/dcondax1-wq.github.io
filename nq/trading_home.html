<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Home</title>
<meta name="description" content="Trading Home: today's 5-line checklist for the PC (bot, keep-alive, alerts, accounts armed, next step in dollars) and one line per account.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- TRADING HOME (owner 2026-11-22). OLYMPUS NIGHT. Reads ONLY ../status_feed.json (the PC's public report) through ../pc_feed.js;
     sends nothing, arms nothing. The text is set with textContent. trading_home_core.js = the rules (node-tested). -->
<style>
:root{--bg:#000;--card:#16131e;--line:#3e255e;--line2:#4d2e76;--glow:#9d59ee;--gold:#f1c14b;--mint:#77db89;--fg:#f2eefb;--mut:#a79fba;--bad:#ff7a8a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 32px}
h1{font-size:24px;margin:6px 0 2px;letter-spacing:.2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.pill{display:inline-block;border:1px solid var(--line2);border-radius:99px;padding:2px 10px;font-size:13px;color:var(--gold);box-shadow:0 0 12px rgba(157,89,238,.35)}
ul{list-style:none;margin:0;padding:0}
li.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:32px 1fr;gap:4px 10px}
li.row.ok{border-color:var(--line2);box-shadow:0 0 14px rgba(119,219,137,.15)}
li.row.no{border-color:var(--line2);box-shadow:0 0 14px rgba(157,89,238,.30)}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--glow);display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--gold);margin-top:1px}
.ok .box{border-color:var(--mint);color:var(--mint)}
.t{font-weight:700;font-size:17px}
.say{grid-column:2;color:var(--fg);font-size:15px}
.no .say{color:#e9ddff}
.menu{grid-column:2;color:var(--gold);font-weight:700;font-size:14px}
button.tick{grid-column:2;justify-self:start;min-height:44px;border-radius:12px;border:1px solid var(--line2);background:#241a36;color:var(--fg);font-size:15px;font-weight:700;padding:0 16px;box-shadow:0 0 12px rgba(157,89,238,.35)}
li.row.gold{border-color:#f1c14b;box-shadow:0 0 14px rgba(241,193,75,.35)}
li.row.mint .t{color:#77db89}
li.row.gold .t{color:#f1c14b}
h2{font-size:16px;margin:18px 0 8px;color:var(--gold);letter-spacing:.3px}
li.acct{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;box-shadow:0 0 10px rgba(157,89,238,.18)}
li.acct.ok{box-shadow:0 0 12px rgba(119,219,137,.15)}
li.acct .an{font-weight:700;font-size:15px}
li.acct .as{font-size:14px;color:var(--fg);overflow-wrap:anywhere}
li.acct.no .an{color:var(--gold)}
.foot{color:var(--mut);font-size:13px;margin-top:10px}
a{color:var(--gold)}
</style>
</head>
<body>
<main>
<h1>Trading Home</h1>
<p class="sub"><span class="pill" id="left">loading...</span> <span id="age"></span></p>
<ul id="rows"></ul>
<h2 id="acctsh" hidden>Accounts</h2>
<ul id="accts"></ul>
<p class="foot">Reads the PC's public report only. Nothing here arms or trades. On the PC, double-click <b>TRADE_HOME</b> and press the number shown.</p>
<p class="foot"><a href="index.html">NQ bots</a> &middot; <a href="../add-account/">Add an account</a> (your private PC link)</p>
</main>
<script src="../pc_feed.js"></script>
<script src="trading_home_core.js"></script>
<script>
(function () {
  var KEY = 'trading_home_alerts_ok';
  function ls(get, v) { try { return get ? localStorage.getItem(KEY) : localStorage.setItem(KEY, v); } catch (e) { return null; } }
  var lite = null;
  function render() {
    var res = window.TRADING_HOME.today(lite, { alertsOkAt: ls(true), mffuView: window.PC_FEED && window.PC_FEED.mffuView });
    var ul = document.getElementById('rows'); ul.textContent = '';
    res.lines.forEach(function (l) {
      var li = document.createElement('li'); li.className = 'row ' + (l.ok === true ? 'ok' : 'no') + (l.tone ? ' ' + l.tone : ''); li.setAttribute('data-id', l.id);
      var b = document.createElement('div'); b.className = 'box'; b.textContent = l.ok === true ? '✓' : '•'; b.setAttribute('aria-label', l.ok === true ? 'done' : 'to do');
      var t = document.createElement('div'); t.className = 't'; t.textContent = l.title;
      var s = document.createElement('div'); s.className = 'say'; s.textContent = l.say;
      li.appendChild(b); li.appendChild(t); li.appendChild(s);
      if (l.ok !== true && l.menu) { var m = document.createElement('div'); m.className = 'menu'; m.textContent = 'PC: TRADE_HOME, press ' + l.menu; li.appendChild(m); }
      if (l.tick && l.ok !== true) {
        var k = document.createElement('button'); k.className = 'tick'; k.type = 'button'; k.textContent = 'I got my test alert';
        k.onclick = function () { ls(false, String(Math.round(Date.now() / 1000))); render(); };
        li.appendChild(k);
      }
      ul.appendChild(li);
    });
    var ua = document.getElementById('accts'); ua.textContent = '';
    (res.accounts || []).forEach(function (a) {   // one line per account: armed / running, room $, today $, next window
      var li = document.createElement('li'); li.className = 'acct ' + (a.ok === true ? 'ok' : 'no'); li.setAttribute('data-id', a.id);
      var n = document.createElement('div'); n.className = 'an'; n.textContent = a.title;
      var t = document.createElement('div'); t.className = 'as'; t.textContent = a.say;
      li.appendChild(n); li.appendChild(t); ua.appendChild(li);
    });
    document.getElementById('acctsh').hidden = !(res.accounts || []).length;
    document.getElementById('left').textContent = res.left ? res.left + ' to do' : 'All done';
    document.getElementById('age').textContent = res.age == null ? 'No PC report' : 'PC reported ' + window.TRADING_HOME.ageText(res.age) + ' ago';
  }
  render();
  function load() {
    if (!window.PC_FEED) return;
    window.PC_FEED.fetchLatest({ feedUrl: new URL('../status_feed.json', location.href).href }).then(function (j) { lite = j || null; render(); }, function () { render(); });
  }
  load(); setInterval(load, 60000);
})();
</script>
</body>
</html>
