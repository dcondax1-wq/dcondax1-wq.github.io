<body class="loading">
<canvas id="bg" aria-hidden="true"></canvas>

<!-- the one top bar: the stories' progress (tap a segment to jump), the name, the period -->

  <div class="bar">
    <span class="brand"><svg viewBox="0 0 32 20" aria-hidden="true"><path d="M2 14c6-1 9-5 12-12-1 6 0 9 2 11 2-2 3-5 2-11 3 7 6 11 12 12-7 2-11 1-14-2-3 3-7 4-14 2z"/></svg>Hermes</span>

  <div class="splash"><span>Hermes</span><small>OLYMPUS Wrapped</small></div>
