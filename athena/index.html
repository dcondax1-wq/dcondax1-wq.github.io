<!doctype html>
<html lang="en" data-theme="agora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athena</title>
<meta name="description" content="ATHENA, your library: a searchable, plain-words knowledge base of your trading system, the MFFU rules, what was tested and rejected, a glossary and what-to-do-when playbooks. Works offline.">
<meta name="theme-color" content="#14110e">
<link rel="apple-touch-icon" href="../jarvis/apple-touch-icon.png?v=j5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Athena">
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../jarvis/icon-192.png?v=j5">
<!-- ATHENA (tools/web_public/athena/, 2026-11-03; 2026-11-04: Ask / Today / Cards / Rules / Saved = athenabrain.js (pure), athenaplus.js (panes), athenastore.js (this phone only, keys 'athena.*'); 2026-11-04 Train = athenatraincore.js (pure) + athenatrain.js (screens), drills.json built by tools/athena_drills.py): the library. The content is library.json, written at build time by
     tools/athena_build.py from STRATEGY.md, research/lit/mffu_rules.json and the 'Tested and rejected' list (an embedded stub in
     athenacore.js when it is missing). Look: athena.css; search, quiz and glossary links: athenacore.js (pure functions); the 3D
     library + the UI: athena.js (render core ../olympus/render.js + materials.js, three.js from ../jarvis/). It fetches nothing but
     its own library.json / jarvis.json, stores nothing, and the quiz feeds nothing outside the page. Bump ?v= on all of them when one changes. -->
<script>(function () { var d = document.documentElement; try { if (window.top !== window) d.classList.add('framed'); } catch (e) { d.classList.add('framed'); } })();</script>
<link rel="stylesheet" href="../olympus/olympus.css?v=o7">
<link rel="stylesheet" href="../olympus/agora.css?v=a5">
<script src="../olympus/themes.js?v=o7"></script>
<script src="../olympus/olympus.js?v=o12" data-app="athena"></script>
<script src="../olympus/a11y.js" defer></script>
<script src="../olympus/intro-app.js?v=i8" defer></script>
<script>(function () { var r = document.documentElement.style; r.setProperty('--oly-accent', '#7f8a52'); r.setProperty('--oly-accent-rgb', '127, 138, 82'); })();</script>
<link rel="stylesheet" href="athena.css?v=a5c">
<script src="../olympus/fx-core.js?v=f1"></script>
</head>
<body>
<canvas id="stage" aria-label="A round library of glowing shelves, one for each topic. Tap a shelf to filter the list." role="img"></canvas>
<div id="nogl" class="nogl" hidden>3D is not available here. Everything works below.</div>
<header class="hud">
  <div class="title"><h1>Athena</h1><span class="tag" id="demo" hidden>STUB LIBRARY</span></div>
  <p class="sub" id="sub">Your library. Tap a shelf.</p>
  <button type="button" class="saved-btn" id="savedBtn" aria-label="Bookmarks and reading history" title="Saved">&#9733;<b class="bd" id="bd-saved" hidden></b></button>
</header>
<section class="sheet" id="sheet" aria-live="polite">
  <div class="pane" id="p-lib" role="tabpanel" aria-label="Library">
    <div class="chips" id="chips" role="group" aria-label="Shelves"></div>
    <p class="count" id="count"></p>
    <div id="list"></div>
  </div>
  <div class="pane" id="p-entry" role="tabpanel" aria-label="Entry" hidden>
    <button type="button" class="back" id="back">&larr; Back</button>
    <div id="entry" class="entry"></div>
  </div>
  <div class="pane" id="p-quiz" role="tabpanel" aria-label="Quiz me" hidden>
    <div id="quiz"></div>
  </div>
  <div class="pane" id="p-ask" role="tabpanel" aria-label="Ask Athena" hidden><div id="ask"></div></div>
  <div class="pane" id="p-today" role="tabpanel" aria-label="Today's lesson" hidden><div id="today"></div></div>
  <div class="pane" id="p-cards" role="tabpanel" aria-label="Flashcards" hidden><div id="cards"></div></div>
  <div class="pane" id="p-rules" role="tabpanel" aria-label="My rules" hidden><div id="rules"></div></div>
  <div class="pane" id="p-train" role="tabpanel" aria-label="Train" hidden><div id="train"></div></div>
  <div class="pane" id="p-saved" role="tabpanel" aria-label="Bookmarks and history" hidden><div id="saved"></div></div>
</section>
<footer class="dock">
  <label class="search"><span class="vh">Search the library</span>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search: sweep, floor, payout..."></label>
  <nav class="tabs" id="tabs" aria-label="Athena">
    <button type="button" data-tab="lib" aria-pressed="true">Library</button><button type="button" data-tab="ask" aria-pressed="false">Ask</button><button type="button" data-tab="today" aria-pressed="false">Today<b class="bd" id="bd-today" hidden></b></button><button type="button" data-tab="cards" aria-pressed="false">Cards<b class="bd" id="bd-cards" hidden></b></button><button type="button" data-tab="rules" aria-pressed="false">Rules</button><button type="button" data-tab="train" aria-pressed="false">Train<b class="bd" id="bd-train" hidden></b></button>
  </nav>
</footer>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="athena.js?v=a7"></script>
<script type="module" src="glossary.js"></script>
</body>
</html>
