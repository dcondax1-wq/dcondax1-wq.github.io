<!doctype html>
<html lang="en" data-theme="agora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argus</title>
<meta name="description" content="ARGUS, the all-seeing watchtower: one screen with every health light (bots, price feed, NinjaTrader, cloud monitor, dashboard, nightly refresh, app data, the 7-day inactivity clock, drawdown left) and a ranked list of what to fix first.">
<meta name="theme-color" content="#14110e">
<link rel="apple-touch-icon" href="../jarvis/apple-touch-icon.png?v=j5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Argus">
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../jarvis/icon-192.png?v=j5">
<!-- ARGUS (tools/web_public/argus/, 2026-11-03): the watchtower. Read only: it reads what the published site already shows
     (../home.json, else ../data.json; ../cronos/status.json; each OLYMPUS app's jarvis.json) and remembers the last good copy for
     offline. Rules and words: arguscore.js (pure functions); the 3D sphere of eyes + the screen: argus.js (render core from
     ../olympus/); look: argus.css. It never talks to a bot or a broker. Bump ?v= on all of them when one changes. -->
<script>(function () { var d = document.documentElement; try { if (window.top !== window) d.classList.add('framed'); } catch (e) { d.classList.add('framed'); } })();</script>
<link rel="stylesheet" href="../olympus/olympus.css?v=o7">
<link rel="stylesheet" href="../olympus/agora.css?v=a7"><link rel="stylesheet" href="../olympus/agora-apps.css?v=g2">
<script src="../olympus/themes.js?v=o9"></script>
<script src="../home_feed.js?v=2"></script><!-- night-feedsB: before the kit (a missing file never trips its "could not load"): home.json / data.json with the PC's post laid over -->
<script src="../olympus/olympus.js?v=o15" data-app="argus"></script>
<script src="../olympus/a11y.js" defer></script>
<script src="../olympus/intro-app.js?v=i10" defer></script>
<script src="../olympus/fx-core.js?v=f1"></script>
<script>(function () { var r = document.documentElement.style; r.setProperty('--oly-accent', '#3f8a8a'); r.setProperty('--oly-accent-rgb', '63, 138, 138'); })();</script>
<link rel="stylesheet" href="argus.css?v=a5b">
</head>
<body>
<canvas id="eyes" aria-label="A sphere of a hundred eyes. Green eyes are fine, amber need a look, red need action, grey are resting." role="img"></canvas>
<div id="nogl" class="nogl" hidden>3D is not available here. Everything works below.</div>
<header class="hud">
  <div class="title"><h1>Argus</h1><span class="tag" id="offtag" hidden>OFFLINE</span><span class="tag demo" id="demotag" hidden>DEMO</span></div>
  <p class="sub" id="sub">Checking the bots, PC and data...</p>
</header>
<p class="pick" id="pick" hidden></p>
<section class="sheet" id="sheet" aria-live="polite">
  <div class="pane" id="p-fix" role="tabpanel" aria-label="Fix this first"></div>
  <div class="pane" id="p-all" role="tabpanel" aria-label="All lights" hidden></div>
  <div class="pane" id="p-hist" role="tabpanel" aria-label="Since yesterday" hidden></div>
  <div class="pane" id="p-money" role="tabpanel" aria-label="Money" hidden></div>
</section>
<aside class="drawer" id="drawer" hidden aria-label="Light details">
  <button type="button" class="oly-close" id="drawerClose" aria-label="Close details">×</button>
  <div class="dbody"></div>
</aside>
<footer class="dock">
  <div class="verdict" id="verdict" data-level="idle" role="status">
    <span class="vk" id="vk">...</span><span class="vs" id="vs"></span>
  </div>
  <p class="vline" id="vline"></p>
  <nav class="tabs" id="tabs" aria-label="Argus">
    <button type="button" data-tab="fix" aria-pressed="true">Fix this first <b id="fixN">0</b></button><button type="button" data-tab="all" aria-pressed="false">All lights</button><button type="button" data-tab="hist" aria-pressed="false">Since yesterday</button><button type="button" data-tab="money" aria-pressed="false">Money</button>
  </nav>
</footer>
<script type="module" src="argus.js?v=a4i"></script>
</body>
</html>
