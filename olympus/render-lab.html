<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OLYMPUS render lab</title>
<meta name="theme-color" content="#14110e">
<meta name="color-scheme" content="dark">
<!-- The OLYMPUS render core's lab (docs/OLYMPUS_RENDER.md): every material of olympus/materials.js on the core's pipeline.
     ?q=ultra|high|low|off picks the tier (default: the kit's), ?flat=1 draws the same scene the old way (flat
     MeshStandard, no environment, no tone mapping, no post: the "Play-Doh" look) for before / after shots, ?still=1 one frame.
     tests/test_olympus_render.py drives it. -->
<link rel="stylesheet" href="olympus.css?v=o7">
<script src="themes.js?v=o9"></script>
<script src="olympus.js?v=o19"></script>
<style>
  html, body { margin: 0; height: 100%; background: #04050c; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .tag { position: fixed; left: 12px; top: calc(10px + env(safe-area-inset-top)); font: 600 12px/1.3 var(--oly-ui, system-ui);
    letter-spacing: .05em; color: rgba(255, 255, 255, .72); pointer-events: none; }
</style>
</head>
<body>
<canvas id="lab"></canvas>
<p class="tag" id="tag">OLYMPUS RENDER</p>
<script type="module">
import * as THREE from '../jarvis/three.module.min.js';
import { createRenderer } from './render.js';
import { marble, metal, glass, neon, fresnelRim, nebula, starfield, energyBeam } from './materials.js';

const q = new URLSearchParams(location.search), flat = q.get('flat') === '1', still = q.get('still') === '1';
const canvas = document.getElementById('lab');
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
camera.position.set(0, 3.2, 13.5); camera.lookAt(0, 1.9, 0);
scene.fog = new THREE.FogExp2(0x070614, 0.025);

// the same scene, the old way: one flat material per part, a hemisphere light, nothing else
const plain = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6 });
const M = flat
  ? { marble: plain(0xe9e6df), gold: plain(0xe8b650), chrome: plain(0xcfd3da), glass: plain(0x9fdcff), neon: plain(0xa855f7), beam: null }
  : { marble: marble({ gold: true }), gold: metal({ kind: 'gold' }), chrome: metal({ kind: 'chrome' }), glass: glass({ color: '#cfe8ff', rim: '#7fa6bd' }),
      neon: neon({ color: '#9c6b3c', intensity: 4 }) };

scene.add(new THREE.HemisphereLight(0xd6dcff, 0x2a2440, flat ? 1.4 : 0.35));
const key = new THREE.DirectionalLight(0xfff1dc, flat ? 1.2 : 2.2); key.position.set(4, 8, 6); scene.add(key);
const glow = new THREE.PointLight(0xa855f7, flat ? 0 : 30, 12, 2); glow.position.set(0, 2.2, 0); scene.add(glow);

const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 96), flat ? plain(0x2a2640) : metal({ kind: 'gunmetal', roughness: 0.22 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const ring = new THREE.Mesh(new THREE.TorusGeometry(6.2, 0.04, 8, 200), M.neon); ring.rotation.x = Math.PI / 2; ring.position.y = 0.02; scene.add(ring);

const cols = [];
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2, x = Math.cos(a) * 4.4, z = Math.sin(a) * 4.4 - 1.5;
  const c = new THREE.Group(); c.position.set(x, 0, z); scene.add(c);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.36, 3.2, 32, 1), M.marble); shaft.position.y = 1.9; c.add(shaft);
  const base = new THREE.Mesh(new THREE.BoxGeometry(1, 0.3, 1), M.marble); base.position.y = 0.15; c.add(base);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(1.04, 0.18, 1.04), M.marble); cap.position.y = 3.6; c.add(cap);
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.05, 12, 48), M.gold); band.rotation.x = Math.PI / 2; band.position.y = 3.35; c.add(band);
  const emb = new THREE.Mesh(new THREE.OctahedronGeometry(0.22), M.gold); emb.position.y = 4.05; c.add(emb); cols.push(emb);
}
const orb = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 40), M.glass); orb.position.y = 2.2; scene.add(orb);
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 3), flat ? plain(0xffffff) : neon({ color: '#c9a06a', intensity: 6 }));
core.position.y = 2.2; scene.add(core);
const chrome = new THREE.Mesh(new THREE.TorusKnotGeometry(0.5, 0.14, 160, 20), M.chrome); chrome.position.set(1.4, 0.7, 3.2); scene.add(chrome);
const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 1, 1.2, 48), flat ? M.marble : fresnelRim(marble(), { color: '#9c6b3c', strength: 1.2 }));
ped.position.y = 0.6; scene.add(ped);

const anim = [];
if (!flat) {
  const beam = energyBeam({ color: '#c9a06a', length: 9, radius: 0.09 }); beam.position.y = 3.1; scene.add(beam); anim.push(beam);
  const neb = nebula({ radius: 34, size: 46 }); scene.add(neb); anim.push(neb);
  const stars = starfield({ count: 1400, radius: 120 }); scene.add(stars); anim.push(stars);
}

const rc = flat ? null : createRenderer({ canvas, scene, camera, quality: q.get('q') || undefined, env: 'night', tint: '#9c6b3c' });
let renderer = rc ? rc.renderer : null;
if (flat) {                         // the "before": no env, no tone mapping, no AA, straight to the screen
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (window.OLYMPUS) OLYMPUS.track(renderer);
}
function step(dt, t) {
  orb.rotation.y = t * 0.2; core.rotation.set(t * 0.7, t * 0.5, 0); chrome.rotation.set(t * 0.3, t * 0.5, 0);
  cols.forEach((e, i) => { e.rotation.y = t + i; });
  anim.forEach((x) => x.update(t, renderer.getPixelRatio()));
}
window.__lab = { rc, renderer, scene, camera, flat };
document.getElementById('tag').textContent = 'OLYMPUS RENDER · ' + (flat ? 'FLAT (before)' : rc.quality().toUpperCase());
if (flat) { step(0, 1.2); renderer.render(scene, camera); }
else if (still) { step(0, 1.2); rc.render(); }
else rc.start(step);
</script>
</body>
</html>
