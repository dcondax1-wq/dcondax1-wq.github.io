<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110e">
<meta name="color-scheme" content="dark">
<title>Jarvis</title>
<!-- datacity/jarvis/ (polish2 2026-11-19): this folder held a stale copy of the Jarvis shell (2026-11-06) with its own copy of the old status
     loop (live.json, kalshi.json, the app cards); it imported ./data.js, ./apps.js ... that were never next to it, so it could not even start.
     There is ONE Jarvis: ../../jarvis/, whose data.js reads the shared PC feed (../pc_feed.js + ../status_feed.json) like every other page.
     This page only hands over to it (the search and the #part kept). No fetch, no loop, no worker here. -->
<meta http-equiv="refresh" content="0; url=../../jarvis/">
<style>
  :root { --bg: #14110e; --ink: #efe6d6; --gold: #dcbd6e; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  a { display: inline-flex; align-items: center; min-height: 44px; color: var(--gold); }
</style>
<script>(function () { try { location.replace('../../jarvis/' + location.search + location.hash); } catch (e) { /* the link below */ } })();</script>
</head>
<body>
<main>
  <p>Jarvis has one home now.</p>
  <p><a href="../../jarvis/">Open Jarvis</a></p>
</main>
</body>
</html>
