<main id="ui">
  <header class="top">
    <div class="brand"><h1>Nemesis</h1><p class="sub">Why each loss happened, and its $</p></div>
    <div class="tags"><span id="demo" class="tag demo" hidden>DEMO</span><span id="lite" class="tag" hidden>LITE</span></div>
  </header>
  <section class="verdict" id="verdict" aria-live="polite">
    <p class="v" id="vText">Reading the trades...</p>
    <div class="tiles">
      <div class="tile"><span class="k">Fallen</span><b id="tFallen">-</b></div>
      <div class="tile lost"><span class="k">Lost</span><b id="tLost">-</b></div>
      <div class="tile leak"><span class="k">Leaks cost</span><b id="tLeak">-</b></div>
    </div>
    <p class="live" id="live" hidden></p>
  </section>
  <nav class="pills" id="pills" aria-label="Views">
    <button type="button" data-view="fallen" aria-pressed="false">Fallen</button>
    <button type="button" data-view="leaks" aria-pressed="false">Leaks</button>
    <button type="button" data-view="vow" aria-pressed="false">Vow</button>
    <button type="button" data-view="about" aria-pressed="false">About</button>
  </nav>
</main>
<section class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
  <header><h2 id="sheetTitle"></h2><button type="button" class="oly-close" id="close" aria-label="Close">×</button></header>
  <div class="body" id="sheetBody"></div>
</section>
<section class="dock" id="dock" aria-label="Week">
  <div class="row wk">
    <button type="button" id="wkPrev" aria-label="Older week">‹</button>
    <div class="wl"><b id="wkLabel">-</b><span id="wkSub">&nbsp;</span></div>
    <button type="button" id="wkNext" aria-label="Newer week">›</button>
    <button type="button" id="wkAll" class="all" aria-pressed="false">All</button>
  </div>
  <p class="help" id="help"><i class="d plan"></i>plan loss (normal) <i class="d soft"></i>leak (small mistake) <i class="d break"></i>rule break</p>
</section>
