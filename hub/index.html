<!-- OLYMPUS HUB PAGE (2026-11-14, docs/OLYMPUS_IA_V2.md). hub/?h=<hub>&t=<tab>: today | me | bots | kalshi | money | plan | research | jarvis | worlds | settings.
     me = the Me hub (docs/ME_HUB.md), a PAGE hub: me.js draws its 4 status tiles and 8 areas from the PC's private me/me.json instead of tabs.
     The hubs and their tabs are DATA in olympus/gate-catalog.js (HUBS + each app's hub / section / fold); the live lines come from olympus/hub-status.js.
     Each tab: the job in one line, the BEST app for it as a big card (its live status from its jarvis.json, "Open", and "Show it here" = the app embedded
     in a frame), the other apps for that job as rows, and the duplicates folded under "Other views of the same" (nothing removed: every old app URL works).
     Breadcrumb Home > Hub and "Go to" come from olympus/gate-nav.js. Read only: home.json (through truth.js), kalshi.json, money/scoreboard.json,
     the hub's apps' jarvis.json, the Planner's summary on this phone. It sends nothing. Text only through textContent / createElementNS. -->
<style>html, body { background: var(--oly-th-n3, #14110e); color: var(--oly-th-n37, #f3ece0); margin: 0; }</style>
<script>(function () { var d = document.documentElement; try { if (window.top !== window) d.className += ' framed'; } catch (e) { d.className += ' framed'; }
  /* this hub's page id for the theme engine ('hub-<id>': the Gate's Mix maps it to its hub, olympus/themes.js pageId) */
  setTimeout(function () { d.className += ' hb-drawn hb-done'; }, 6000);   /* NAV 2026-11-20: a hub.js that never runs must not leave the blocks hub.css holds hidden */
  var m = /[?&]h=([a-z]+)/.exec(location.search || ''); if (!m) return;
  d.setAttribute('data-oly-district', m[1]); d.setAttribute('data-oly-page', 'hub-' + m[1]);
  /* NAV 2026-11-20 (perf ask): hub.css holds the Right now height and keeps the blocks below hidden until hub.js has drawn them (hb-drawn / hb-done): no layout shift */
})();</script>

  var c = g === 'agora' ? null : JSON.parse(ls.getItem('olympus.theme.look.' + W + '.' + g) || 'null');

<body>
<main id="hub" class="hb-main">
  <div class="gn-row" data-gn-slot aria-hidden="true"></div><!-- the Home / Go to row of olympus/gate-nav.js, reserved from the first paint (it fills this slot) -->
  <header class="hb-head" id="hubHead">
    <h1 class="hb-title" id="hubName">Your hubs</h1>
    <p class="hb-q" id="hubQ">Pick the job you want to do.</p>
  </header>

  <section class="hb-now" id="hubNow" aria-label="Right now in this hub" hidden>

  </section>

  <div class="hb-tabs" id="tabs" role="tablist" aria-label="Jobs in this hub" hidden></div>
